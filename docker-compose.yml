services:
  app:
    image: ${APP_IMAGE:-language-ai-app:latest}
    build: .
    ports:
      - "127.0.0.1:${DEPLOY_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the public HTTPS origin}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      OPENAI_CLIENT_ID: ${OPENAI_CLIENT_ID:-}
      OPENAI_CLIENT_SECRET: ${OPENAI_CLIENT_SECRET:-}
      OPENAI_TOKEN_AUTH_METHOD: ${OPENAI_TOKEN_AUTH_METHOD:-none}
      OPENAI_REDIRECT_URI: ${OPENAI_REDIRECT_URI:-}
      CACHE_DIR: /data/cache
      AUTH_DIR: /data/auth
    volumes:
      - ${CACHE_HOST_DIR:-/var/lib/language-ai-app}:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
